<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AuspiCal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="logo">AuspiCal</h1>
        <div class="nav-controls">
          <button id="prevBtn" class="btn btn-secondary">&lt;</button>
          <button id="todayBtn" class="btn btn-secondary">今日</button>
          <button id="nextBtn" class="btn btn-secondary">&gt;</button>
        </div>
        <div class="date-selector-group">
          <select id="yearSelect" class="select-box"></select>
          <select id="monthSelect" class="select-box"></select>
        </div>
        <div id="currentRangeLabel" class="current-range-label"></div>
      </div>

      <div class="header-right">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="予定を検索..." />
          <button id="clearSearchBtn" class="btn-clear hidden">&times;</button>
        </div>

        <div class="view-switcher">
          <button data-view="year" class="btn btn-view" title="ショートカット: Y">年 (Y)</button>
          <button data-view="month" class="btn btn-view active" title="ショートカット: M">月 (M)</button>
          <button data-view="week" class="btn btn-view" title="ショートカット: W">週 (W)</button>
          <button data-view="day" class="btn btn-view" title="ショートカット: D">日 (D)</button>
        </div>

        <button id="openAddModalBtn" class="btn btn-primary">+ 予定を追加</button>

        <div class="account-menu-container">
          <button id="accountBtn" class="btn-account" title="アカウント">
            <span id="accountAvatarIcon" class="avatar-icon">👤</span>
          </button>
          <div id="accountDropdown" class="account-dropdown hidden">
            <div class="account-dropdown-info">
              <div id="accountDropdownName" class="account-dropdown-name"></div>
              <div id="accountDropdownDevice" class="account-dropdown-device"></div>
            </div>
            <hr class="dropdown-divider" />
            <button id="logoutBtn" class="btn btn-secondary btn-full text-danger">ログアウト</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Calendar Views -->
    <main class="calendar-content">
      <section id="yearView" class="view-panel">
        <div id="yearGrid" class="year-grid"></div>
      </section>

      <section id="monthView" class="view-panel active">
        <div class="weekdays-grid">
          <div class="weekday col-sun">日</div>
          <div class="weekday col-weekday">月</div>
          <div class="weekday col-weekday">火</div>
          <div class="weekday col-weekday">水</div>
          <div class="weekday col-weekday">木</div>
          <div class="weekday col-weekday">金</div>
          <div class="weekday col-sat">土</div>
        </div>
        <div id="monthDaysGrid" class="days-grid"></div>
      </section>

      <section id="weekView" class="view-panel">
        <div class="week-header-row" id="weekHeaderRow"></div>
        <div class="week-allday-row" id="weekAllDayRow"></div>
        <div class="timeline-scroll-area">
          <div class="timeline-grid-container" id="weekTimelineContainer"></div>
        </div>
      </section>

      <section id="dayView" class="view-panel">
        <div class="day-split-view">
          <div class="day-left-pane">
            <div class="pane-title" id="dayTimelineTitle">タイムライン</div>
            <div class="day-allday-row" id="dayAllDayRow"></div>
            <div class="timeline-scroll-area">
              <div class="timeline-grid-container" id="dayTimelineContainer"></div>
            </div>
          </div>
          <div class="day-right-pane">
            <div class="pane-title" id="dayListTitle">予定一覧</div>
            <div class="day-list-container" id="dayListContainer"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ログインモーダル -->
  <div id="authModal" class="modal-overlay hidden">
    <div class="modal-box auth-modal-box">
      <div class="modal-header">
        <h3 id="authModalTitle">アカウントにログイン</h3>
        <button id="closeAuthModalBtn" class="btn-close">&times;</button>
      </div>

      <!-- モーダル共通エラー枠 -->
      <div id="authErrorMsg" class="auth-error-msg hidden"></div>

      <!-- Step 1: 入力画面 -->
      <div id="authStepInput">
        <form id="authInitForm">
          <div class="form-group">
            <label for="authUsername">アカウント名 <span class="required">*</span></label>
            <input type="text" id="authUsername" required placeholder="例: yamada" autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="authDevice">デバイス名 <span class="required">*</span></label>
            <input type="text" id="authDevice" required placeholder="例: メインPC, MacBook Air" />
          </div>
          <div class="auth-notice">
            ※ アカウント名とデバイス名を入力後、「ウェブで認証」をクリックすると安全な認証コードが発行されます。
          </div>
          <div class="modal-actions">
            <button type="button" id="cancelAuthBtn" class="btn btn-secondary">キャンセル</button>
            <button type="submit" id="startAuthBtn" class="btn btn-primary">ウェブで認証</button>
          </div>
        </form>
      </div>

      <!-- Step 2: 待機画面 -->
      <div id="authStepWaiting" class="hidden">
        <div class="auth-code-container">
          <div class="auth-code-label">発行された認証コード</div>
          <div id="authDisplayCode" class="auth-code-value">--------</div>
          <button id="copyAuthCodeBtn" class="btn btn-secondary btn-sm" style="margin-top: 8px;">コードをコピー</button>
        </div>

        <div class="auth-instructions">
          <p>以下のボタンをクリックしてブラウザを開き、パスキー認証を行ってください。</p>
          <button id="openBrowserBtn" class="btn btn-primary btn-full web-auth-link-btn">
            ブラウザで認証を開く ↗
          </button>
        </div>

        <div class="polling-status-box">
          <div class="spinner"></div>
          <div class="polling-status-texts">
            <span id="pollingStatusText">認証の完了を待機中...</span>
            <span id="pollingTimerText" class="timer-badge">残り 05:00</span>
          </div>
        </div>

        <div class="modal-actions" style="margin-top: 16px;">
          <button type="button" id="abortAuthBtn" class="btn btn-secondary">認証を中止</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 予定追加・編集モーダル -->
  <div id="eventModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">予定を追加</h3>
        <button id="closeModalBtn" class="btn-close">&times;</button>
      </div>
      <form id="eventForm">
        <input type="hidden" id="editingEventId" value="" />

        <div class="form-group">
          <label for="eventTitle">タイトル <span class="required">*</span></label>
          <input type="text" id="eventTitle" required placeholder="例: 出張、旅行、会議" />
        </div>

        <div class="form-group-checkbox">
          <label>
            <input type="checkbox" id="eventIsAllDay" />
            <span class="checkbox-label">終日イベント</span>
          </label>
        </div>

        <div class="form-row">
          <div class="form-group flex-2">
            <label for="eventStartDate">開始日 <span class="required">*</span></label>
            <input type="date" id="eventStartDate" min="1970-01-01" required />
          </div>
          <div class="form-group flex-1" id="startTimeGroup">
            <label for="eventStartTime">開始時刻</label>
            <input type="time" id="eventStartTime" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-2">
            <label for="eventEndDate">終了日 <span class="required">*</span></label>
            <input type="date" id="eventEndDate" min="1970-01-01" required />
          </div>
          <div class="form-group flex-1" id="endTimeGroup">
            <label for="eventEndTime">終了時刻</label>
            <input type="time" id="eventEndTime" />
          </div>
        </div>

        <div class="form-group">
          <label>カラー</label>
          <div class="color-picker-row">
            <input type="color" id="eventColor" value="#3b82f6" class="color-input" />
            <div class="recent-colors-container">
              <span class="recent-label">最近使用した色:</span>
              <div id="recentColorsList" class="recent-colors-list"></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="eventDesc">詳細 / メモ</label>
          <textarea id="eventDesc" rows="3" placeholder="メモを入力..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">キャンセル</button>
          <button type="submit" id="submitEventBtn" class="btn btn-primary">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 削除確認モーダル -->
  <div id="deleteConfirmModal" class="modal-overlay hidden">
    <div class="modal-box modal-box-small">
      <div class="modal-header">
        <h3 style="color: #ef4444;">予定の削除</h3>
      </div>
      <p id="deleteConfirmMessage" class="confirm-message">この予定を削除しますか？</p>
      <div class="modal-actions">
        <button id="cancelDeleteBtn" class="btn btn-secondary">キャンセル</button>
        <button id="executeDeleteBtn" class="btn btn-danger">削除</button>
      </div>
    </div>
  </div>

  <div id="searchResults" class="search-dropdown hidden"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
