[package]
name = "auspical"
version = "0.1.0"
description = "AuspiCal Desktop Calendar App"
authors = ["AuspiCal Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"
open = "5.3"
